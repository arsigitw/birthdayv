<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Silvi ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="birthday-page">
  <main class="birthday-screen page-enter">
    <div class="grain"></div>
    <div id="hearts" aria-hidden="true"></div>

    <section class="birthday-content">
      <p class="eyebrow">09 • 09 • 2026</p>
      <h1>Happy Birthday,</h1>
      <h2>Silvi <span>♡</span></h2>

      <div class="divider"><span>✦</span></div>

      <p class="message">
        Today is your day.<br>
        And I wanted to make<br>
        a little place just for you.
      </p>

      <p class="signature">— Ari</p>

      <button id="continueButton" class="continue-button">
        <span>THERE'S MORE</span>
        <span>↓</span>
      </button>
    </section>
  </main>

  <script src="birthday.js"></script>
</body>
</html>
