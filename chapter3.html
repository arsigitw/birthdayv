<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Is Silvi ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="chapter3.css">
</head>

<body class="chapter3-page">

  <div id="pageTransition" class="page-transition" aria-hidden="true"></div>

  <!-- Doodle rain layer -->
  <div id="doodleRain" class="doodle-rain" aria-hidden="true"></div>

  <header class="chapter-top">
    <span class="chapter-mark">CHAPTER 03</span>

    <div class="lang-switch" aria-label="Language">
      <button id="langEN" type="button">EN</button>
      <button id="langID" type="button">ID</button>
    </div>
  </header>

  <div class="progress">
    <span id="progressFill"></span>
  </div>

  <main class="book" id="book">

    <!-- =====================================================
         COVER
         ===================================================== -->
    <section class="page cover active" data-page="0">

      <div class="paper-glow"></div>

      <div class="doodle heart heart-1">♡</div>
      <div class="doodle heart heart-2">♡</div>
      <div class="doodle star star-1">✦</div>
      <div class="doodle star star-2">✧</div>
      <div class="doodle flower flower-1">✿</div>
      <div class="doodle tiny-note note-1">a little chapter about you ♡</div>
      <div class="doodle tiny-note note-2">same brighter,<br>kinder you</div>

      <div class="page-content cover-content">

        <p
          class="eyebrow"
          data-en="A LITTLE PORTRAIT OF YOU"
          data-id="SEDIKIT TENTANG KAMU">
        </p>

        <h1
          data-en="THIS IS<br><em>SILVI</em>"
          data-id="INI ADALAH<br><em>SILVI</em>">
        </h1>

        <div class="scribble-line"></div>

        <p
          class="lead"
          data-en="Not just the girl I love,<br>but the girl I keep discovering."
          data-id="Bukan cuma perempuan yang aku sayang,<br>tapi perempuan yang terus aku kenal lebih dalam.">
        </p>

        <button class="next-btn cover-btn" data-next="1" type="button">
          <span
            data-en="LET ME TELL YOU"
            data-id="BIAR AKU CERITAKAN">
          </span>
          <b>↓</b>
        </button>

        <p
          class="click-hint"
          data-en="click to continue"
          data-id="klik untuk lanjut">
        </p>

      </div>
    </section>


    <!-- =====================================================
         01 - TALKATIVE
         ===================================================== -->
    <section class="page dark" data-page="1">

      <div class="paper-tear left"></div>

      <div class="doodle speech">
        <span data-en="so many<br>stories..." data-id="banyak<br>cerita..."></span>
      </div>

      <div class="doodle sparkle sp-1">✦</div>
      <div class="doodle sparkle sp-2">✧</div>
      <div class="doodle little-envelope">♡</div>

      <div class="page-content story-content">

        <div class="number">01 / 04</div>

        <p
          class="eyebrow"
          data-en="THE TALKATIVE ONE"
          data-id="YANG BANYAK CERITA">
        </p>

        <h2
          data-en="You always<br>have something to say."
          data-id="Kamu selalu<br>punya sesuatu untuk diceritakan.">
        </h2>

        <p
          class="body-copy"
          data-en="You're talkative. Very talkative, actually.<br><br>You always have something to comment on, something to talk about, or somehow know a place I've never heard of before.<br><br>You can turn the simplest moment into a whole conversation."
          data-id="Kamu itu cerewet. Bahkan, sangat cerewet.<br><br>Selalu ada sesuatu yang ingin kamu komentari, sesuatu yang ingin kamu ceritakan, atau entah bagaimana kamu selalu tahu tempat yang bahkan belum pernah aku dengar.<br><br>Kamu bisa membuat hal sesederhana apa pun berubah jadi sebuah percakapan panjang.">
        </p>

        <p
          class="hand-note"
          data-en="And honestly... I like listening."
          data-id="Dan jujur... aku suka mendengarkannya.">
        </p>

        <button class="next-btn" data-next="2" type="button">
          <span data-en="NEXT" data-id="LANJUT"></span>
          <b>→</b>
        </button>
      </div>
    </section>


    <!-- =====================================================
         02 - OWN MIND
         ===================================================== -->
    <section class="page paper" data-page="2">

      <div class="doodle circle-note">
        <span data-en="keep<br>being<br>you ♡" data-id="tetap<br>jadi<br>dirimu ♡"></span>
      </div>

      <div class="doodle bow">୨୧</div>
      <div class="doodle star star-3">✦</div>
      <div class="doodle sketch-line">〰</div>

      <div class="page-content story-content">

        <div class="number">02 / 04</div>

        <p
          class="eyebrow"
          data-en="THE GIRL WITH HER OWN MIND"
          data-id="PEREMPUAN DENGAN PENDIRIANNYA SENDIRI">
        </p>

        <h2
          data-en="You know<br>what you want."
          data-id="Kamu tahu<br>apa yang kamu mau.">
        </h2>

        <p
          class="body-copy"
          data-en="One of the things I like about you is that you have your own mind.<br><br>You know what you like. You know what you don't like. And you don't simply change your mind because someone else thinks differently.<br><br>You have your own way of seeing things."
          data-id="Salah satu hal yang aku suka dari kamu adalah kamu punya pendirian sendiri.<br><br>Kamu tahu apa yang kamu suka. Kamu tahu apa yang nggak kamu suka. Dan kamu nggak begitu saja mengubah pendirian hanya karena orang lain punya pendapat berbeda.<br><br>Kamu punya caramu sendiri dalam melihat sesuatu.">
        </p>

        <p
          class="hand-note blue-note"
          data-en="And I think that's something special about you."
          data-id="Dan menurutku, itu salah satu hal yang membuatmu istimewa.">
        </p>

        <button class="next-btn" data-next="3" type="button">
          <span data-en="NEXT" data-id="LANJUT"></span>
          <b>→</b>
        </button>
      </div>
    </section>


    <!-- =====================================================
         03 - SOFTER SIDE
         ===================================================== -->
    <section class="page blue" data-page="3">

      <div class="doodle cloud">☁</div>
      <div class="doodle cloud-heart">♡</div>
      <div class="doodle sun">☼</div>
      <div class="doodle star star-4">☆</div>

      <div class="page-content story-content">

        <div class="number">03 / 04</div>

        <p
          class="eyebrow"
          data-en="THE SIDE I KNOW"
          data-id="SISI YANG AKU TAHU">
        </p>

        <h2
          data-en="You don't always<br>have to be strong."
          data-id="Kamu nggak harus<br>selalu kuat.">
        </h2>

        <p
          class="body-copy"
          data-en="People might see you as independent. Someone who can handle things on her own.<br><br>But I know there's another side of you.<br><br>A softer side. A little spoiled. A little vulnerable. A side that doesn't always have to pretend she's okay."
          data-id="Orang mungkin melihatmu sebagai seseorang yang mandiri. Seseorang yang bisa menghadapi semuanya sendiri.<br><br>Tapi aku tahu ada sisi lain dari dirimu.<br><br>Sisi yang lebih lembut. Sedikit manja. Sedikit rentan. Sisi yang nggak selalu harus berpura-pura baik-baik saja.">
        </p>

        <p
          class="hand-note light-note"
          data-en="You don't have to be strong around me."
          data-id="Kamu nggak harus selalu kuat kalau bersamaku.">
        </p>

        <button class="next-btn light-btn" data-next="4" type="button">
          <span data-en="ONE LAST THING" data-id="SATU HAL LAGI"></span>
          <b>→</b>
        </button>
      </div>
    </section>


    <!-- =====================================================
         04 - THIS IS YOU
         ===================================================== -->
    <section class="page final" data-page="4">

      <div class="doodle final-heart">♡</div>
      <div class="doodle final-star">✦</div>
      <div class="doodle final-flower">✿</div>

      <div class="page-content story-content">

        <div class="number">04 / 04</div>

        <p
          class="eyebrow"
          data-en="THIS IS YOU"
          data-id="INI KAMU">
        </p>

        <h2
          data-en="I wouldn't<br>change you."
          data-id="Aku nggak akan<br>mengubahmu.">
        </h2>

        <p
          class="body-copy"
          data-en="The talkative you.<br>The independent you.<br>The stubborn you.<br>The funny you.<br>The spoiled you.<br>The vulnerable you.<br><br>All of it."
          data-id="Kamu yang cerewet.<br>Kamu yang mandiri.<br>Kamu yang punya pendirian.<br>Kamu yang suka bercanda.<br>Kamu yang manja.<br>Kamu yang rentan.<br><br>Semuanya.">
        </p>

        <div
          class="final-line"
          data-en="If someone asked me now,<br>“What is Silvi like?”<br><strong>She's Silvi.</strong>"
          data-id="Kalau sekarang ada yang bertanya,<br>“Silvi itu orangnya seperti apa?”<br><strong>Dia ya Silvi.</strong>">
        </div>

        <a
          class="home-btn"
          href="chapter4/chapter4.html"
          data-en="NEXT CHAPTER →"
          data-id="CHAPTER BERIKUTNYA →">
        </a>
      </div>
    </section>

  </main>

  <div
    id="hint"
    class="hint"
    data-en="click, swipe, or use ← → to turn the page"
    data-id="klik, swipe, atau gunakan ← → untuk berpindah halaman">
  </div>

  <script src="chapter3.js"></script>
</body>
</html>
